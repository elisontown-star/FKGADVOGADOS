function log(msg, cls='info'){
  const d = document.getElementById('log');
  d.style.display = 'block';
  d.innerHTML += `<div class="${cls}">${msg}</div>`;
  d.scrollTop = d.scrollHeight;
}

async function run(){
  const btn = document.getElementById('btn');
  btn.disabled = true;
  document.getElementById('log').innerHTML = '';
  document.getElementById('summary').style.display = 'none';
  document.getElementById('progress').style.display = 'block';
  
  const base = document.getElementById('url').value.replace(/\/+$/,'');
  const user = document.getElementById('user').value;
  const pass = document.getElementById('pass').value;
  
  log('🔐 Autenticando...');
  let token;
  try{
    const r = await fetch(base+'/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user,password:pass})});
    const j = await r.json();
    if(!j.token) throw new Error(j.error||'Login falhou');
    token = j.token;
    log('✅ Login OK', 'ok');
  }catch(e){
    log('❌ Erro no login: '+e.message, 'err');
    btn.disabled = false;
    return;
  }
  
  const dates = Object.keys(ATTENDANCE).sort();
  let ok=0, fail=0;
  
  for(let i=0;i<dates.length;i++){
    const date = dates[i];
    try{
      const r = await fetch(base+'/api/attendance/'+date,{
        method:'PUT',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
        body:JSON.stringify(ATTENDANCE[date])
      });
      const j = await r.json();
      if(j.ok){ log(`✅ ${date} importado`, 'ok'); ok++; }
      else { log(`⚠️ ${date} — ${JSON.stringify(j)}`, 'err'); fail++; }
    }catch(e){
      log(`❌ ${date} — ${e.message}`, 'err'); fail++;
    }
    document.getElementById('bar').style.width = (((i+1)/dates.length)*100)+'%';
    await new Promise(r=>setTimeout(r,200));
  }
  
  const summary = document.getElementById('summary');
  summary.style.display = 'block';
  summary.innerHTML = fail === 0
    ? `🎉 <strong>Importação concluída!</strong> ${ok} datas importadas com sucesso. Acesse o sistema e confira o dashboard.`
    : `⚠️ ${ok} datas OK, ${fail} com erro. Verifique o log acima.`;
  
  btn.disabled = false;
  btn.textContent = '↺ Importar novamente';
}
</script>
